name: Refresh NFL Digest

on:
  schedule:
    - cron: '0 12 * * 2-6' # noon UTC, Tue-Sat
  workflow_dispatch: # lets you trigger manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data folders
        run: mkdir -p data/raw

      - name: Run fetch scripts
        run: |
          python scripts/fetch_pbp.py || true
          python scripts/fetch_espn.py || true
          python scripts/fetch_nextgen.py || true
          python scripts/fetch_news.py || true

      - name: Build digest
        run: python scripts/build_digest.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Auto-refresh digest" || echo "No changes"
          git push
