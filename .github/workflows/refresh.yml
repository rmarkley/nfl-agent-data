name: Refresh NFL Digest

on:
  schedule:
    - cron: "0 12 * * 2-6"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data folders
        run: mkdir -p data/raw

      - name: Run fetch scripts
        run: |
          python scripts/fetch_pbp.py || true
          python scripts/fetch_espn.py || true
          python scripts/fetch_nextgen.py || true
          python scripts/fetch_news.py || true
          python scripts/fetch_tactics.py || true
          python scripts/fetch_fantasy_matchups.py || true
          python scripts/fetch_schedule_grid.py || true
          python scripts/fetch_funnel.py || true
          python scripts/fetch_player_stats.py || true
      - name: Build digest
        run: python scripts/build_digest.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add weekly_digest.md data/raw/
          git commit -m "Auto-refresh digest" || echo "No changes"
          git push
